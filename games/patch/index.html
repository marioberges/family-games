const preciseText = c => c.precise.find(p => p.ok).text;
const moved = f => f.initial == null || f.updated == null ? 0 : Math.abs(f.updated - f.initial);

/* the confidence slider: no thumb until it's touched, so there is no default answer */
function sliderBlock(field, v, ghost, locked){
  const pos = x => `left:calc(14px + (100% - 28px) * ${x / 100})`;
  return `<div class="conf-wrap"><div class="spread"><span class="big" id="bigN">${v == null ? "?" : v}</span><span class="mute small">out of 100</span></div>` +
    `<div class="slider" role="slider" tabindex="${locked ? -1 : 0}" aria-label="How sure are you, from 0 to 100" aria-valuemin="0" aria-valuemax="100"` +
    ` aria-valuenow="${v == null ? "" : v}" aria-valuetext="${v == null ? "Not set yet" : v}" ${locked ? 'aria-disabled="true"' : ""} data-slider="${field}">` +
    `<div class="track"></div>${ghost != null ? `<div class="ghost" style="${pos(ghost)}" data-v="${ghost}"></div>` : ""}` +
    `${v != null ? `<div class="thumb" style="${pos(v)}"></div>` : ""}</div>` +
    `<div class="ends"><span>Sure it's false</span><span>No idea</span><span>Sure it's true</span></div></div>`;
}
function setSlider(el, v){
  v = Math.max(0, Math.min(100, Math.round(v)));
  const c = claimById(view.id); if(!c) return;
  const inv = I(c.id);
  inv.f[el.dataset.slider] = v;
  let th = $(".thumb", el);
  if(!th){ th = document.createElement("div"); th.className = "thumb"; el.appendChild(th); }
  th.style.left = `calc(14px + (100% - 28px) * ${v / 100})`;
  el.setAttribute("aria-valuenow", v); el.setAttribute("aria-valuetext", v);
  const big = $("#bigN"); if(big) big.textContent = v;
  const nx = $("#next"); if(nx) nx.disabled = !canNext(c, inv);
  saveSoon();
}
function sliderFromPoint(el, clientX){
  const t = $(".track", el).getBoundingClientRect();
  if(!t.width) return;
  setSlider(el, (clientX - t.left) / t.width * 100);
}
let dragging = null;
app.addEventListener("pointerdown", e => {
  const el = e.target.closest(".slider");
  if(!el || el.getAttribute("aria-disabled") === "true") return;
  dragging = el;
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  sliderFromPoint(el, e.clientX); e.preventDefault();
});
app.addEventListener("pointermove", e => { if(dragging) sliderFromPoint(dragging, e.clientX); });
app.addEventListener("pointerup", () => { if(dragging){ dragging = null; save(); } });
app.addEventListener("pointercancel", () => { dragging = null; });

function invNext(c, inv){
  if(!canNext(c, inv)) return;
  if(inv.i === 2) inv.f.locked = true;
  if(inv.i === 5 && inv.sub < c.evidence.length - 1){ inv.sub++; view.aside = null; save(); render(); scrollTop(); return; }
  if(inv.i === 11){ finishCard(c, inv); return; }
  inv.i++; view.aside = null; tapPick = [];
  if(inv.i === 3 && inv.f.nodes && !inv.f.nodesChecked) tapPick = inv.f.nodes.slice();
  state.at = view; save();
  if(updateReady){ try{ location.reload(); return; }catch(e){} }
  render(); scrollTop();
}
function invPrev(c, inv){
  if(inv.i === 5 && inv.sub > 0){ inv.sub--; }
  else if(inv.i > 0){ inv.i--; if(inv.i === 5) inv.sub = c.evidence.length - 1; }
  view.aside = null; save(); render(); scrollTop();
}
const scrollTop = () => { try{ window.scrollTo(0, 0); }catch(e){} };

function finishCard(c, inv){
  const f = inv.f, m = moved(f);
  const ev = c.evidence.find(e => e.id === f.mover);
  /* Updating is the achievement: a number that moved because of a named piece
     of evidence, or one that held still for a stated reason. */
  const gold = (m >= 5 && !!ev) || (m < 5 && (f.belief || "").trim().length >= 20);
  const card = {id:c.id, title:c.title, heard:c.heard, precise:preciseText(c), source:f.source || "",
    initial:f.initial, updated:f.updated, verdict:(f.verdict || "").trim(), mover:ev ? ev.label : "None of them",
    belief:(f.belief || "").trim(), changeMind:(f.changeMind || "").trim(), decision:f.decision,
    matters:f.matters || "", stands:c.stands, gold, evidence:c.evidence.length, done:ymd()};
  state.cards[c.id] = card;
  state.journal.unshift({id:"j" + Date.now().toString(36), at:ymd(), claim:c.id, kind:"card",
    text:`${c.title}: ${card.verdict}\nMy confidence went from ${card.initial} to ${card.updated}. ${card.belief}`});
  delete state.inv[c.id];
  view = {s:"card", id:c.id}; state.at = view; save();
  fresh = true; render(); scrollTop();
}

/* ============ the card ============ */
function cardScreen(){
  const c = state.cards[view.id];
  app.className = "wrap";
  if(!c){ app.innerHTML = bar("Card", "") + `<p>No card here yet.</p><button class="btn" data-act="home">Home</button>`; return; }
  const x = v => 20 + v * 2.6;
  const arrow = `<svg viewBox="0 0 300 40" aria-hidden="true"><line x1="20" y1="20" x2="280" y2="20" stroke="#F0CBD5" stroke-width="6" stroke-linecap="round"/>` +
    `<circle cx="${x(c.initial)}" cy="20" r="8" fill="#fff" stroke="#80606B" stroke-width="2" stroke-dasharray="3 2"/>` +
    (c.initial !== c.updated ? `<line x1="${x(c.initial)}" y1="20" x2="${x(c.updated)}" y2="20" stroke="#9E2B4E" stroke-width="3"/>` : "") +
    `<circle cx="${x(c.updated)}" cy="20" r="9" fill="#9E2B4E"/></svg>`;
  app.innerHTML = bar(c.title, `Investigated ${niceDate(c.done)}`) +
    `<article class="card${c.gold ? " gold" : ""}${fresh ? " fresh" : ""}">${cardMark(c)}` +
    `<p class="heard">“${esc(c.heard)}”</p><p class="verdict">${esc(c.verdict)}</p>` +
    `<div class="move" aria-label="Confidence went from ${c.initial} to ${c.updated}"><span class="n mute">${c.initial}</span>${arrow}<span class="n">${c.updated}</span></div>` +
    (c.gold ? `<p class="goldnote">Gold edge and a bow: ${moved(c) >= 5 ? "your number moved, and you said which evidence moved it." : "your number held, and you said why."}</p>` : "") +
    `<dl><div><dt>The precise claim</dt><dd>${esc(c.precise)}</dd></div>` +
    `<div><dt>Where you heard it</dt><dd>${esc(c.source)}</dd></div>` +
    `<div><dt>What moved you most</dt><dd>${esc(c.mover)}. ${esc(c.belief)}</dd></div>` +
    `<div><dt>What would change your mind</dt><dd>${esc(c.changeMind)}</dd></div>` +
    `<div><dt>Your decision</dt><dd>${esc(c.decision)}</dd></div>` +
    `<div><dt>Where the evidence stands</dt><dd>${esc(c.stands)}</dd></div></dl></article>` +
    `<div class="row" style="justify-content:center;margin-top:22px"><button class="btn" data-act="sharecard" data-id="${esc(c.id)}">Share my verdict</button>` +
    `<button class="btn soft" data-act="home">Home</button></div>`;
}

/* The verdict image: one line, the claim, the two numbers. Small enough to send. */
function wrapText(ctx, text, maxW){
  const words = String(text).split(/\s+/), lines = [];
  let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
  if(cur) lines.push(cur);
  return lines;
}
const BOW_PATHS = [
  ["M58 36 C40 10 8 6 8 28 C8 46 36 48 58 40Z", "#E98AA2"], ["M62 36 C80 10 112 6 112 28 C112 46 84 48 62 40Z", "#E98AA2"],
  ["M58 36 C44 22 20 18 18 28 C17 36 36 40 58 39Z", "#F4B6C6"], ["M62 36 C76 22 100 18 102 28 C103 36 84 40 62 39Z", "#F4B6C6"],
  ["M55 42 L36 76 L46 72 L52 78 L60 44Z", "#D9718D"], ["M65 42 L84 76 L74 72 L68 78 L60 44Z", "#D9718D"]];
function verdictCanvas(c){
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1350;
  const ctx = cv.getContext && cv.getContext("2d");
  if(!ctx) return null;
  const SERIF = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif', ROUND = 'ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
  ctx.fillStyle = "#FFF8F9"; ctx.fillRect(0, 0, 1080, 1350);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  rr(70, 150, 940, 1110, 60); ctx.fillStyle = "#fff"; ctx.fill();
  ctx.lineWidth = c.gold ? 14 : 5; ctx.strokeStyle = c.gold ? "#C3933A" : "#F0CBD5"; ctx.stroke();
  if(c.gold){
    ctx.save(); ctx.translate(540 - 156, 64); ctx.scale(2.6, 2.6);
    if(typeof Path2D === "function") BOW_PATHS.forEach(([d, fill]) => { ctx.fillStyle = fill; ctx.fill(new Path2D(d)); });
    ctx.fillStyle = "#C9587A"; ctx.fillRect(51, 30, 18, 16); ctx.restore();
  }else{
    /* the patch, stuck on the card's top edge */
    const disc = (r, fill) => { ctx.beginPath(); ctx.arc(540, 150, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); };
    disc(96, "#E98AA2"); disc(86, "#FFF8F9"); disc(60, "#F7D3DC"); disc(16, "#9E2B4E");
  }
  ctx.textAlign = "center"; ctx.fillStyle = "#80606B"; ctx.font = `40px ${ROUND}`; ctx.fillText("I looked into", 540, 340);
  ctx.fillStyle = "#3B2830"; ctx.font = `62px ${SERIF}`;
  let y = 430;
  wrapText(ctx, `“${c.heard}”`, 800).slice(0, 4).forEach(l => { ctx.fillText(l, 540, y); y += 76; });
  y += 40; ctx.fillStyle = "#9E2B4E"; ctx.font = `600 54px ${ROUND}`;
  wrapText(ctx, c.verdict, 820).slice(0, 4).forEach(l => { ctx.fillText(l, 540, y); y += 68; });
  y = Math.max(y + 60, 1000);
  ctx.fillStyle = "#80606B"; ctx.font = `38px ${ROUND}`; ctx.fillText("How sure I was, before and after", 540, y);
  ctx.font = `92px ${SERIF}`; ctx.fillStyle = "#80606B"; ctx.fillText(String(c.initial), 380, y + 120);
  ctx.fillStyle = "#9E2B4E"; ctx.fillText(String(c.updated), 700, y + 120);
  ctx.strokeStyle = "#E98AA2"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(470, y + 88); ctx.lineTo(600, y + 88); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(585, y + 70); ctx.lineTo(610, y + 88); ctx.lineTo(585, y + 106); ctx.stroke();
  ctx.fillStyle = "#80606B"; ctx.font = `32px ${ROUND}`; ctx.fillText("Checked with Patch", 540, 1310);
  return cv;
}
async function shareCard(id){
  const c = state.cards[id]; if(!c) return;
  const cv = verdictCanvas(c);
  if(!cv){ toast("Images can't be made here."); return; }
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if(!blob){ toast("The image didn't work. Try again."); return; }
  const file = new File([blob], `patch-${c.id}.png`, {type:"image/png"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:`${c.title}: my verdict`}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Saved the image.");
}

/* ============ journal ============ */
function journalScreen(){
  app.className = "wrap";
  app.innerHTML = bar("Journal", "Private. Nothing leaves this device unless you share it.") +
    `<div class="narrow"><label for="note"><h3>Add a note</h3></label>` +
    `<textarea id="note" data-note placeholder="Something you noticed, wondered, or changed your mind about">${esc(state.noteDraft || "")}</textarea>` +
    `<div class="row" style="margin:10px 0 24px"><button class="btn" data-act="addnote">Save note</button>` +
    (state.journal.length ? `<button class="btn soft" data-act="copyall">Copy my whole journal</button>` : "") + `</div>` +
    (state.journal.length ? state.journal.map(e => `<div class="entry"><span class="when">${esc(niceDate(e.at))}</span><p>${esc(e.text)}</p>` +
      `<button class="btn ghost" data-act="shareentry" data-id="${esc(e.id)}">Share this entry with a parent</button></div>`).join("") :
      `<div class="empty">Your notes and finished investigations show up here.</div>`) + `</div>`;
}
async function shareText(title, text){
  try{
    if(navigator.share){ await navigator.share({title, text}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("Copied. Paste it into a message."); }
  catch(e){ toast("Sharing isn't available here."); }
}

/* ============ input ============ */
function tapNode(id){
  if(view.s === "explore"){ view.node = id; view.depth = 0; state.at = view; save(); render(); return; }
  if(view.s === "lesson"){
    const les = LESSON[view.id], rec = L(les.id), st = les.steps[rec.i];
    if(st && st.t === "tap" && rec.a[rec.i] == null){
      tapPick = [id]; applySkin({picked:tapPick});
      const b = $("#check"); if(b) b.disabled = false;
      return;
    }
    peek = id; const cap = $("#capText");
    if(cap) cap.innerHTML = `<b>${esc(NODES[id].name)}.</b> ${esc(NODES[id].intuition)}`;
    applySkin({focus:[id]});
    return;
  }
  if(view.s === "inv"){
    const c = claimById(view.id); if(!c) return;
    const inv = I(c.id);
    if(inv.i === 3 && !inv.f.nodesChecked){
      tapPick = tapPick.includes(id) ? tapPick.filter(n => n !== id) : [...tapPick, id];
      inv.f.nodes = tapPick.slice(); saveSoon(); render();
      return;
    }
    const cap = $("#capText");
    if(cap) cap.innerHTML = `<b>${esc(NODES[id].name)}.</b> ${esc(NODES[id].intuition)}`;
  }
}
app.addEventListener("click", e => {
  const n = e.target.closest("[data-node]");
  if(n && n.closest(".skin")){ tapNode(n.dataset.node); return; }
  const a = e.target.closest("[data-act]");
  if(!a || a.disabled) return;
  act(a.dataset.act, a);
});
app.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest("[data-node]");
  if(n && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tapNode(n.dataset.node); return; }
  const s = e.target.closest && e.target.closest(".slider");
  if(s && s.getAttribute("aria-disabled") !== "true"){
    const cur = Number(s.getAttribute("aria-valuenow"));
    const base = s.getAttribute("aria-valuenow") === "" ? 50 : cur;
    const d = {ArrowRight:5, ArrowUp:5, ArrowLeft:-5, ArrowDown:-5, PageUp:10, PageDown:-10}[e.key];
    if(d != null){ e.preventDefault(); setSlider(s, s.getAttribute("aria-valuenow") === "" ? 50 : base + d); }
    else if(e.key === "Home"){ e.preventDefault(); setSlider(s, 0); }
    else if(e.key === "End"){ e.preventDefault(); setSlider(s, 100); }
  }
});
app.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.sim){ sim[t.dataset.sim] = t.type === "checkbox" ? t.checked : Number(t.value); paintSim(); return; }
  if(t.hasAttribute("data-note")){ state.noteDraft = t.value; saveSoon(); return; }
  if(t.dataset.field && view.s === "inv"){
    const c = claimById(view.id); if(!c) return;
    const inv = I(c.id);
    inv.f[t.dataset.field] = t.value; saveSoon();
    const nx = $("#next"); if(nx) nx.disabled = !canNext(c, inv);
  }
});
app.addEventListener("change", e => { if(e.target.dataset.sim){ sim[e.target.dataset.sim] = e.target.type === "checkbox" ? e.target.checked : Number(e.target.value); paintSim(); } });

function act(name, el){
  const id = el.dataset.id;
  switch(name){
    case "home": go({s:"home"}); return;
    case "explore": go({s:"explore"}); return;
    case "journal": go({s:"journal"}); return;
    case "node": view.node = id; view.depth = 0; save(); render(); return;
    case "deeper": view.depth = (view.depth || 0) + 1; render(); return;
    case "labels": labelsOn = !labelsOn; el.textContent = labelsOn ? "Hide names" : "Show names"; el.setAttribute("aria-pressed", labelsOn);
      $(".skin") && $(".skin").classList.toggle("labels", labelsOn); return;
    case "lesson": go({s:"lesson", id, ret:el.dataset.ret || null}); return;
    case "redo": state.lessons[id] = {i:0, done:true, a:{}}; go({s:"lesson", id}); return;
    case "lpick": { const rec = L(view.id); rec.a[rec.i] = Number(el.dataset.k); save(); render(); return; }
    case "lcheck": { const rec = L(view.id); if(!tapPick.length) return; rec.a[rec.i] = tapPick[0]; tapPick = []; save(); render(); return; }
    case "lnext": { const les = LESSON[view.id], rec = L(les.id); rec.i++; if(rec.i >= les.steps.length) rec.done = true;
      peek = null; tapPick = []; state.at = view; save();
      if(updateReady){ try{ location.reload(); return; }catch(e){} }
      render(); scrollTop(); return; }
    case "lprev": { const rec = L(view.id); rec.i = Math.max(0, rec.i - 1); peek = null; save(); render(); scrollTop(); return; }
    case "inv": go({s:"inv", id}); return;
    case "card": go({s:"card", id}); return;
    case "sharecard": shareCard(id); return;
    case "addnote": { const t = (state.noteDraft || "").trim(); if(!t){ toast("Write something first."); return; }
      state.journal.unshift({id:"j" + Date.now().toString(36), at:ymd(), kind:"note", text:t}); state.noteDraft = ""; save(); render(); return; }
    case "shareentry": { const e = state.journal.find(x => x.id === id); if(e) shareText("From my Patch journal", `${niceDate(e.at)}\n${e.text}`); return; }
    case "copyall": shareText("My Patch journal", state.journal.map(e => `${niceDate(e.at)}\n${e.text}`).join("\n\n")); return;
  }
  /* investigation actions */
  const c = claimById(view.id); if(!c) return;
  const inv = I(c.id), f = inv.f;
  switch(name){
    case "field": f[el.dataset.f] = el.dataset.v; save(); render(); return;
    case "precise": { const k = Number(el.dataset.k); if(f.precisePick == null && f.preciseFirst == null) f.preciseFirst = k;
      f.precisePick = k; if(c.precise[k].ok) f.preciseOk = true; save(); render(); return; }
    case "nodescheck": f.nodes = tapPick.slice(); f.nodesChecked = true; tapPick = []; save(); render(); return;
    case "rate": f.chain[el.dataset.k] = el.dataset.v; save(); render(); return;
    case "chainshow": f.chainShown = true; save(); render(); return;
    case "aside": view.aside = id; render(); return;
    case "evreact": f.ev[id] = el.dataset.v; save(); render(); return;
    case "unknown": { const k = Number(el.dataset.k); f.unknowns = (f.unknowns || []).includes(k) ? f.unknowns.filter(x => x !== k) : [...(f.unknowns || []), k]; save(); render(); return; }
    case "inext": invNext(c, inv); return;
    case "iprev": invPrev(c, inv); return;
  }
}

/* ============ boot ============ */
load();
if(validView(state.at)) view = state.at;
render();
loadClaims();

/* ---- update delivery ----
   Cache-first shell, and iOS freezes rather than relaunches a home-screen app,
   so check for a new worker when the app comes back, and switch to it at the
   next screen boundary (go, and the step buttons), where everything is saved. */
if("serviceWorker" in navigator){
  try{
    const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", () => {
        if(sw.state === "installed" && navigator.serviceWorker.controller) updateReady = true;
      });
    });
    let lastCheck = 0;
    const maybeCheck = () => {
      if(document.visibilityState !== "visible") return;
      if(Date.now() - lastCheck < 15 * MIN) return;
      lastCheck = Date.now();
      reg.update().catch(() => {});
      loadClaims();     /* a new weekly claim may have been pushed */
    };
    document.addEventListener("visibilitychange", maybeCheck);
    window.addEventListener("pageshow", maybeCheck);
    maybeCheck();
  }
  catch(e){ console.warn("Service worker didn't register:", e); }
}
})();
</script>
